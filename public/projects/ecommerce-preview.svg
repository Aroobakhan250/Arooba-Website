  <rect x="640" y="108" width="80" height="28" rx="6" fill="url(#ecomAccent)"/>
  <text x="680" y="126" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cart (3)</text>
  
  <!-- Product Grid -->
  <!-- Product 1 -->
  <rect x="65" y="160" width="210" height="275" rx="10" fill="#0F172A" stroke="#334155"/>
  <rect x="80" y="175" width="180" height="130" rx="8" fill="#1E293B"/>
  <circle cx="170" cy="240" r="35" fill="#6366F1" opacity="0.3"/>
  <text x="80" y="330" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="700">Wireless Noise-Canceling ANC</text>
  <text x="80" y="352" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Hi-Res Audio • 40hr Battery</text>
  <text x="80" y="380" fill="#6366F1" font-family="Inter, sans-serif" font-size="15" font-weight="800">$189.99</text>
  <rect x="80" y="395" width="180" height="28" rx="6" fill="url(#ecomAccent)"/>
  <text x="170" y="413" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>

  <!-- Product 2 -->
  <rect x="295" y="160" width="210" height="275" rx="10" fill="#0F172A" stroke="#334155"/>
  <rect x="310" y="175" width="180" height="130" rx="8" fill="#1E293B"/>
  <rect x="350" y="210" width="100" height="60" rx="4" fill="#6366F1" opacity="0.3"/>
  <text x="310" y="330" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="700">Ergonomic Mechanical Board</text>
  <text x="310" y="352" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Hot-swappable • RGB Backlit</text>
  <text x="310" y="380" fill="#6366F1" font-family="Inter, sans-serif" font-size="15" font-weight="800">$129.50</text>
