<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative code grid / circuit elements -->
  <circle cx="200" cy="200" r="160" stroke="#6366F1" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>
  <circle cx="200" cy="200" r="135" stroke="url(#ringGrad)" stroke-width="3" filter="url(#glow)" fill="none"/>
  
  <!-- Avatar silhouette with modern professional aesthetic -->
  <g transform="translate(100, 75)">
    <!-- Base Glow -->
    <ellipse cx="100" cy="180" rx="70" ry="35" fill="#6366F1" opacity="0.25"/>
    
    <!-- Torso / Blazer silhouette -->
    <path d="M40 220 C40 165, 70 145, 100 145 C130 145, 160 165, 160 220 Z" fill="#334155"/>
    <path d="M60 220 L100 165 L140 220" stroke="#6366F1" stroke-width="2.5" fill="none"/>
    
    <!-- Neck -->
    <rect x="91" y="115" width="18" height="30" rx="6" fill="#F8FAFC" opacity="0.85"/>
    
    <!-- Head -->
    <ellipse cx="100" cy="85" rx="36" ry="42" fill="#F8FAFC" opacity="0.95"/>
    
    <!-- Hair / Hijab silhouette -->
    <path d="M62 85 C62 45, 80 32, 100 32 C120 32, 138 45, 138 85 C138 125, 130 145, 100 145 C70 145, 62 125, 62 85 Z" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    
    <!-- Face interior -->
    <ellipse cx="100" cy="88" rx="26" ry="32" fill="#CBD5E1"/>
    
    <!-- Friendly smiling features -->
    <path d="M88 102 Q100 114 112 102" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="89" cy="84" r="3" fill="#334155"/>
    <circle cx="111" cy="84" r="3" fill="#334155"/>
  </g>
  
  <!-- Floating tech badge 1 -->
  <g transform="translate(45, 90)">
    <rect width="68" height="30" rx="15" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <text x="34" y="19" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">&lt;code/&gt;</text>
  </g>

  <!-- Floating tech badge 2 -->
  <g transform="translate(285, 270)">
    <rect width="72" height="30" rx="15" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <text x="36" y="19" fill="#818CF8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FullStack</text>
  </g>
</svg>
